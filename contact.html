<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — Vittoris</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>

    body{
      background:#000;
      overflow-x:hidden;
      font-family: Inter, sans-serif;
    }

    .glass{
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(30px);
      border:1px solid rgba(255,255,255,0.08);
    }

    .smooth{
      transition: all 900ms cubic-bezier(0.22,1,0.36,1);
    }

    .input-style{
      width:100%;
      background:transparent;
      border-bottom:1px solid rgba(255,255,255,0.18);
      padding:16px 0;
      color:white;
      font-size:18px;
      outline:none;
    }

    .input-style::placeholder{
      color:rgba(255,255,255,0.35);
    }

    .input-style:focus{
      border-color:#ff7a00;
    }

    /* ORBS */

    .orb{
      position:absolute;
      border-radius:999px;
      filter:blur(120px);
      opacity:.65;
      animation: float 18s ease-in-out infinite;
      pointer-events:none;
    }

    .orb-1{
      width:500px;
      height:500px;
      background:#ff6b00;
      top:-100px;
      left:-100px;
    }

    .orb-2{
      width:420px;
      height:420px;
      background:#ff8c00;
      bottom:-100px;
      right:-80px;
      animation-delay:4s;
    }

    .orb-3{
      width:280px;
      height:280px;
      background:#ff5e00;
      top:40%;
      left:45%;
      animation-delay:8s;
    }

    @keyframes float{

      0%{
        transform:translate(0,0) scale(1);
      }

      25%{
        transform:translate(80px,-40px) scale(1.1);
      }

      50%{
        transform:translate(-40px,60px) scale(.95);
      }

      75%{
        transform:translate(60px,20px) scale(1.05);
      }

      100%{
        transform:translate(0,0) scale(1);
      }

    }

  </style>

</head>

<body class="text-white">

  <!-- BACKGROUND -->

  <div class="fixed inset-0 overflow-hidden">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="absolute inset-0 bg-black/70 backdrop-blur-[80px]"></div>

  </div>

  <!-- PAGE -->
  <nav class="glass relative top-2 left-1/2 -translate-x-1/2 w-[95%] z-30 rounded-[30px] px-8 py-4  flex items-center justify-between">

    <!-- LOGO -->
    <div class="text-5xl font-black tracking-tight text-orange-400 bg-gradient-to-r from-white/10 -to-transparent">
      <a href="index.html">Vittoris.</a>
    </div>
  
    <!-- NAV LINKS -->
    <ul class="hidden md:flex gap-10 text-sm uppercase tracking-widest ">
      <li class="line-hover cursor-pointer text-white"><a href="index.html">Home</a></li>
      <li class="line-hover cursor-pointer text-white"><a href="about.html">About</a></li>
      <li class="line-hover cursor-pointer text-white"><a href="contact.html">Contact</a></li>
    </ul>
  

  
  </nav>

  <section class="relative z-20 min-h-screen px-8 md:px-20 py-10">

    <!-- CONTACT -->

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-24 items-start">

      <!-- LEFT -->

      <div>

        <p class="
          uppercase
          tracking-[0.3em]
          text-orange-300
          text-sm
          mb-10
        ">
          Contact
        </p>

        <h1 class="
          text-5xl
          md:text-7xl
          font-black
          tracking-[-0.08em]
          leading-[0.95]
          max-w-[700px]
        ">

          Let’s build systems that scale your business.

        </h1>

        <p class="
          mt-10
          text-white/60
          text-xl
          leading-relaxed
          max-w-[620px]
        ">

          Whether it's AI automation, client acquisition, brand systems,
          or intelligent growth infrastructure — Vittoris helps modern
          businesses operate at scale.

        </p>

        <div class="mt-16">

          <a
            href="mailto:asterop980@gmail.com"
            class="
              inline-flex
              items-center
              gap-4
              px-8
              py-4
              rounded-full
              border
              border-white/15
              hover:border-orange-500
              hover:bg-orange-500/10
              smooth
            "
          >

           vittoris.com

          </a>

        </div>

      </div>

      <!-- FORM -->

      <div class="
        glass
        rounded-[2.5rem]
        p-10
      ">

      <form
      id="contactForm"
      class="space-y-12"
    >      

          <!-- disable captcha -->
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">

          <!-- redirect -->
          <input
            type="hidden"
            name="_next"
            value="thankyou.html"
          >

          <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

            <div>

              <input
                type="text"
                name="name"
                placeholder="Name*"
                required
                class="input-style"
              />

            </div>

            <div>

              <input
                type="text"
                name="company"
                placeholder="Organisation*"
                required
                class="input-style"
              />

            </div>

          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

            <div>

              <input
                type="email"
                name="email"
                placeholder="Email*"
                required
                class="input-style"
              />

            </div>

            <div>

              <input
                type="tel"
                name="phone"
                placeholder="Phone Number*"
                required
                class="input-style"
              />

            </div>

          </div>

          <div>

            <input
              type="text"
              name="service"
              placeholder="What service are you looking for?"
              class="input-style"
            />

          </div>

          <div>

            <textarea
              name="message"
              rows="5"
              placeholder="Tell us about your project..."
              class="input-style resize-none"
            ></textarea>

          </div>

          <!-- BUTTON -->

          <button
            type="submit"
            class="
              group
              flex
              items-center
              gap-6
              text-5xl
              md:text-7xl
              font-black
              tracking-[-0.08em]
              hover:text-orange-400
              smooth
            "
          >

            <div class="
              w-16
              h-16
              rounded-full
              bg-white
              group-hover:bg-orange-500
              smooth
            "></div>

            Send

          </button>

        </form>

      </div>

    </div>

  </section>
  <script>

    const form = document.getElementById("contactForm");
    
    form.addEventListener("submit", async (e) => {
    
      e.preventDefault();
    
      const formData = new FormData(form);
    
      try {
    
        const response = await fetch(
          "https://formsubmit.co/ajax/asterop980@gmail.com",
          {
            method: "POST",
            headers: {
              Accept: "application/json"
            },
            body: formData
          }
        );
    
        if (response.ok) {
    
          alert("Message sent successfully.");
    
          form.reset();
    
        } else {
    
          alert("Something went wrong.");
    
        }
    
      } catch (error) {
    
        alert("Error sending message.");
    
      }
    
    });
    
    </script>

</body>
</html>
